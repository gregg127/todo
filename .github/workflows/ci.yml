name: CI
on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e   # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true

      # These can be set in the go env config file, where an empty environment
      # variable does not override them, so assert rather than unset.
      - name: Assert checksum verification is enabled
        run: |
          set -eu
          for v in GOFLAGS GOPRIVATE GONOSUMDB GONOPROXY GOINSECURE; do
            val="$(go env $v)"
            [ -z "$val" ] || { echo "::error::$v is set to '$val'"; exit 1; }
          done
          [ "$(go env GOSUMDB)" = "sum.golang.org" ] || { echo "::error::GOSUMDB is $(go env GOSUMDB)"; exit 1; }

      - run: go mod download   # checks go.sum and the checksum database
      - run: go mod verify     # re-hashes the module cache
      - run: go mod tidy -diff # go.mod matches what is actually imported
      - run: go vet ./...
      - run: go test ./...

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
